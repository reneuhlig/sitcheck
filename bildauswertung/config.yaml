video:
  source: /sitcheck/bildauswertung/LiveFeed Simulation/basic loop.mp4
  fallback_source: ''
  reconnect_delay: 1.0
  max_retries: 0
  hwaccel: auto
  youtube_cookies_from_browser: ''
  youtube_cookiefile: www.youtube.com_cookies.txt
  youtube_format: best[ext=mp4]/best
  youtube_player_client: android
  input_mode: livefeed_simulation
  simulation:
    directory: LiveFeed Simulation
    control_mode: remote_control
    default_clip_id: basic-loop
tracking:
  model_path: models/yolo26n.pt
  device: auto
  tracker: bytetrack_entrance.yaml
  confidence_threshold: 0.15
  iou_threshold: 0.45
  imgsz: 640
  analysis_roi:
    enabled: true
    mode: polygon
    x_min: 0.0
    y_min: 0.0
    x_max: 1.0
    y_max: 1.0
    polygon_points: []
  tta_enabled: false
  max_detections: 300
  stabilization_enabled: true
  track_hold_frames: 8
  box_ema_alpha: 0.6
  hold_confidence_decay: 0.88
  trail_length: 16
  motion_min_pixels: 1.8
  process_every_n_frames: 1
preprocess:
  enabled: false
  upscale: 1.0
  clahe_clip: 2.0
  denoise: false
dashboard:
  stream_fps: 30
  capture_max_fps: 30
  visual_update_fps: 30
  jpeg_quality: 100
  jpeg_optimize: false
  stream_max_width: 1280
  analysis_queue_frames: 128
  analysis_skip_threshold_frames: 4
  dynamic_skip_enabled: true
  dynamic_skip_queue_threshold: 4
  dynamic_skip_max_n: 5
  dash:
    enabled: true
    output_dir: runtime/dash
    segment_time: 0.5
    list_size: 6
    preset: ultrafast
    tune: zerolatency
    crf: 36
    hwaccel: auto
    vaapi_device: /dev/dri/renderD128
    abr:
      enabled: true
      high_bitrate_kbps: 1400
      low_bitrate_kbps: 650
      low_scale: 0.6
  capture_buffer_size: 24
  model_buffer_size: 6
  model_latency_frames: 2
  render_buffer_size: 12
  visual_stale_fallback_sec: 0.25
